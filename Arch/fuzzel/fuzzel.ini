# ~/.config/fuzzel/fuzzel.ini
# 应用启动器主题：vault 色盘（琥珀磷光 + 牛油果绿），和终端/dam/river 边框统一
# 校验：fuzzel --check-config

[main]
font=JetBrainsMono Nerd Font:style=Regular:size=13
use-bold=yes
dpi-aware=no

# 交互
prompt=" "
placeholder=Search Apps
hide-before-typing=no
auto-select=yes
match-mode=fzf
sort-result=yes
icons-enabled=yes

# 尺寸
lines=10
width=35
horizontal-pad=60
vertical-pad=40
inner-pad=10

[colors]
background=0a0a00f5
text=c8b400ff
prompt=88b04bff
placeholder=5a5200ff
input=88b04bff
match=c8b400ff
selection=88b04bff
selection-text=0a0a00ff
selection-match=0a0a00ff
border=88b04bff

[border]
width=2
radius=12
