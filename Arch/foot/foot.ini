# -*- conf -*-
# ~/.config/foot/foot.ini

app-id=foot
title=foot
locked-title=no

# ---------------- 字体 ----------------
font=Hack Nerd Font:size=12
line-height=24px

# ---------------- 窗口 ----------------
initial-color-theme=dark
initial-window-size-chars=100x30
pad=8x8 center-when-maximized-and-fullscreen
resize-by-cells=yes
resize-keep-grid=yes
bold-text-in-bright=no
selection-target=clipboard
word-delimiters=,│`|:"'()[]{}<>

[environment]
# name=value

[security]
# 允许终端程序读写剪贴板
osc52=enabled

[bell]
system=yes
urgent=no
notify=yes
visual=no

[desktop-notifications]
# close= 命令为空时用默认行为

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[url]
launch=xdg-open ${url}
style=dotted
osc8-underline=url-mode

[cursor]
style=beam
blink=yes
beam-thickness=1.5
unfocused-style=hollow

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[touch]
long-press-delay=400

[colors-dark]
alpha=1.0
alpha-mode=default
background=0a0a00
foreground=c8b400
cursor=0a0a00 c8b400
flash=c8b400
flash-alpha=0.4

## Normal/regular colors (0-7)
regular0=0a0a00
regular1=cc4400
regular2=88b04b
regular3=c8b400
regular4=5a5200
regular5=5a5200
regular6=a3c47a
regular7=c8b400

## Bright colors (8-15)
bright0=2a2800
bright1=cc4400
bright2=a3c47a
bright3=c8b400
bright4=5a5200
bright5=5a5200
bright6=88b04b
bright7=e8d400

[key-bindings]
show-urls-launch=Control+Shift+o
