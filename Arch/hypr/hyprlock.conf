# ~/.config/hypr/hyprlock.conf
# 安装：sudo pacman -S hyprlock
# 语法按 hyprlock 0.9.x（注意是 input-field，带连字符）：
# 参考 /usr/share/hypr/hyprlock.conf
# 配色/位置安排 all done

# $font = JetBrainsMono Nerd Font
$font = Hack Nerd Font Bold
$font_regular = Hack Nerd Font Italic

general {
    hide_cursor = true
    ignore_empty_input = false
}

# 这些在 0.9 里是顶层选项，不能放进 general 块
grace = 2
no_fade_in = false
fade_in_duration = 300
no_fade_out = false
fade_out_duration = 300

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ---------------- 密码输入框 ----------------
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    outer_color = rgb(0a0a00)
    inner_color = rgb(0a0a00)
    font_color = rgb(c8b400)
    fade_on_empty = false
    placeholder_text = <i>Input your password</i>
    hide_input = false
    check_color = rgb(88b04b)
    fail_color = rgb(cc4400)
    fail_text = <i>$PAMFAIL$FPRINTFAIL</i>
    rounding = 12
    font_family = $font
    position = 0, -200
    halign = center
    valign = center
}

# ---------------- 时钟 ----------------
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb(e8d400)
    font_size = 110
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +%Y-%m-%d
    color = rgb(7aaa00)
    font_size = 22
    font_family = $font_regular
    position = -90, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +%A
    color = rgb(5a5200)
    font_size = 22
    font_family = $font_regular
    position = 90, 0
    halign = center
    valign = center
}

# ---------------- 背景 ----------------
# path = screenshot 表示截取当前画面并做模糊，锁屏时还能看到桌面轮廓
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 1
    brightness = 0.35
    contrast = 1.0
}
